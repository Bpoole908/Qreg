# @package _global_
defaults:
- override /policy: mer
- override /task_seq: ???
- _self_

name_prefix: ${task_seq.name}-mer_
name: ${call_module:crl.policies.mer.mer_dqn_policy_config.experiment_tag,${policy},${task_seq}}

task_seq:
  num_timesteps: 300000

policy:
  policy_kwargs:
    batch_size: 32
    buffer_size: 50000
    within_batch_beta: 1
    across_batch_gamma: 0.3
    reset_buffer: False 
    reset_optimizer: False
    combined_sampling: True
    online: False
