# @package _global_
# NOTE: Packnet will use ALL weights when evaluating minihack tasks that are used for evaluation only.
defaults:
- override /policy: packnet
- override /task_seq: ???
- _self_

name_prefix: ${task_seq.name}-packnet_
name: ${call_module:crl.policies.packnet.packnet_dqn_policy_config.experiment_tag,${policy},${task_seq}}

task_seq:
  num_timesteps: 300000

policy:
  policy_kwargs:
    buffer_size: 50000
    reset_buffer: True
    reset_optimizer: True