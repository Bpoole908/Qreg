# @package _global_
defaults:
- override /policy: data-rehearsal
- override /exp: ???
- _self_

name_prefix: ${exp.name}-dr-dqn_
name: ${call_module:crl.policies.data_rehearsal.drdqn_policy_config.experiment_tag,${policy},${exp}}

exp:
  num_timesteps: 300000

policy:
  policy_kwargs:
    buffer_size: 50000
    rrb_buffer_size: 100000
    learning_rate: 0.0001
    rrb_add_frequency: 2001 
    rrb_add_history: 2000 
    rrb_update_frequency: null
    timesteps_per_collection: 4
    rrb_batch_size: 256
    wait_to_reg: true
    rrb_add_sample_size: 64 # Sample only a few samples at a time 64 approximates 10k per 300k
    iteratively_compute_samples: true
    iterative_compute_size: 2000
    rrb_loss_kwargs:
      lambda_e: 0
      lambda_qhead: 0
      lambda_q: 1
      soft_embeddings: false
      soft_q_values: false

      