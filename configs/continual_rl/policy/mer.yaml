policy_kwargs:
  across_batch_gamma: 0.3
  batch_size: 16
  buffer_size: 50000
  combined_sampling: true
  dqn_kwargs: {}
  exploration_rate: 0.05
  handle_timeout_termination: false
  learning_rate: 0.0001
  loss_kwargs:
    discount_factor: 0.99
    reward_clipping_func:
      _partial_: true
      _target_: torch.clamp
      max: 1
      min: -1
  loss_name: dqn
  online: True
  optimize_memory_usage: true
  optimizer_class: null
  render_collection_freq: null
  reset_buffer: false
  reset_optimizer: false
  save_replay_buffer: true
  steps: 1
  target_update_frequency: 10000
  timesteps_per_collection: 4
  timesteps_per_save: ${exp.num_timesteps}
  track_task_id: true
  update_after: null
  within_batch_beta: 1
policy_struct:
  _target_: continual_rl.available_policies.PolicyStruct
  config:
    _target_: hydra.utils.get_class
    path: crl.policies.mer.mer_dqn_policy_config.MERDQNPolicyConfig
  policy:
    _target_: hydra.utils.get_class
    path: crl.policies.mer.mer_dqn_policy.MERDQNPolicy