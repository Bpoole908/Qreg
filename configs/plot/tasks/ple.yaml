  i: 1
  y_range: ${y_range.1}
  yaxis_dtick: ${yaxis_dtick.1}
  showlegend: True
  train_regions:
    _target_: crl.common.utils.get_cycle_regions
    start: ${eval:${num_task_steps} * 1}
    end: ${eval:${num_task_steps} * 2}
    cycle_size: ${cycle_size}
    num_cycles: ${num_cycles}
