- name: ${task_names.0}
  i: 0 
  y_range: ${y_range.0}
  yaxis_dtick: ${yaxis_dtick.0}
  showlegend: True
  train_regions:
    _target_: crl.common.utils.get_cycle_regions
    start: 0
    end: ${num_task_steps}
    cycle_size: ${cycle_size}
    num_cycles: ${num_cycles}
